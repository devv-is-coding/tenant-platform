memory_limit = 512M
max_execution_time = 120

upload_max_filesize = 64M
post_max_size = 64M

expose_php = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The image's code never changes in production, so never stat files for it.
; The dev target re-enables revalidation (Dockerfile, zz-dev.ini).
opcache.validate_timestamps = 0

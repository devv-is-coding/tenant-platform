# .env is the single source of truth for app config and secrets, and is gitignored.
# The app service reads it wholesale via env_file - nothing here re-declares an app
# variable. The mariadb service can only take MARIADB_*-prefixed names, so those are
# mapped from the same .env values; `:?` makes compose refuse to start if one is unset.
services:
  app:
    build:
      context: .
      target: app
    image: tenant-platform
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Not app config: tells FrankenPHP to serve plain HTTP on :80 inside the container.
      SERVER_NAME: ":80"
    ports:
      - "${APP_PORT:-8000}:80"
    # The bind mount shadows the source baked into the image at build time, so host
    # edits are live in the container with no rebuild. opcache.validate_timestamps=1
    # in docker/php.ini picks up changed PHP within revalidate_freq (2s), and the
    # entrypoint runs `optimize:clear` whenever APP_ENV is not production.
    #
    # Because /app comes from the host, these must exist on the host:
    #   composer install         -> vendor/
    #   npm ci && npm run build  -> public/build/   (or `npm run dev` for HMR)
    #
    # Rebuild only when the image itself changes: Dockerfile, docker/php.ini,
    # docker/entrypoint.sh, or PHP extensions.
    volumes:
      - .:/app
      # Explicit so storage/logs/laravel.log is readable from the host.
      - ./storage:/app/storage

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${DB_DATABASE:?missing in .env}"
      MARIADB_USER: "${DB_USERNAME:?missing in .env}"
      MARIADB_PASSWORD: "${DB_PASSWORD:?missing in .env}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?missing in .env}"
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      # Grants the app user rights over tenant% databases. Only runs when the
      # data directory is empty, i.e. on a fresh volume.
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mariadb-data:

# .env is the single source of truth for app config and secrets, and is gitignored.
# The app service reads it wholesale via env_file - nothing here re-declares an app
# variable. The mariadb service can only take MARIADB_*-prefixed names, so those are
# mapped from the same .env values; `:?` makes compose refuse to start if one is unset.
services:
  app:
    build:
      context: .
      target: dev
    image: tenant-platform
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Not app config: tells FrankenPHP to serve plain HTTP on :80 inside the container.
      SERVER_NAME: ":80"
    ports:
      - "${APP_PORT:-8000}:80"
    # The source is NOT bind-mounted. On Windows a bind mount of the repo is a 9p
    # share of the C: drive, roughly 15x slower per file than the container's own
    # disk, and Laravel touches ~1,100 files per request - that alone made every
    # page take ~3s. Instead the image carries the source and vendor/, and
    # `docker compose up --watch` syncs host edits into /app (see develop.watch).
    # opcache.validate_timestamps=1 picks up synced PHP within revalidate_freq (2s).
    #
    # Sync is one-way, host -> container: run `php artisan make:*` on the host.
    #
    # Only rarely-touched paths stay bind-mounted, where the 9p cost is harmless:
    volumes:
      # Host-built assets (`npm run build`), the Vite HMR `hot` file
      # (`npm run dev`), and the public/storage symlink.
      - ./public:/app/public
      # So storage/logs/laravel.log is readable from the host.
      - ./storage/logs:/app/storage/logs
      # So uploaded files survive the container being recreated.
      - ./storage/app:/app/storage/app
    develop:
      watch:
        - path: .
          target: /app
          action: sync
          initial_sync: true
          ignore:
            - vendor/
            - node_modules/
            - public/
            - storage/
            - bootstrap/cache/
            - .git/
        - path: composer.json
          action: rebuild
        - path: composer.lock
          action: rebuild

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${DB_DATABASE:?missing in .env}"
      MARIADB_USER: "${DB_USERNAME:?missing in .env}"
      MARIADB_PASSWORD: "${DB_PASSWORD:?missing in .env}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?missing in .env}"
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      # Grants the app user rights over tenant% databases. Only runs when the
      # data directory is empty, i.e. on a fresh volume.
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mariadb-data:
